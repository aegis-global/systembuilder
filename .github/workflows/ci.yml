name: CI for Aegis SystemBuilder Monorepo
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          java-version: '11'
      - name: Build Backend (Java)
        run: cd sb__backend-java && ./gradlew build
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - name: Install Backend (Python) dependencies
        run: cd sb__backend-python && pip install -r requirements.txt
      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: '1.18'
      - name: Build Backend (Go)
        run: cd sb__backend-go && go build
      - name: Build Frontend
        run: cd sb__frontend/solid-project && bun build
